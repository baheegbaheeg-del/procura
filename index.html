<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Procura</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--text:#15332e;--muted:#6c7e7a;--p:#0f766e;--p2:#0b5f59;--line:#dbe7e4;--soft:#eaf4f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}.brand b{display:block;font-size:20px}.brand small{color:var(--muted);font-size:11px}
main{width:min(1100px,calc(100% - 20px));margin:22px auto}.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}.pill{display:inline-block;background:var(--soft);color:var(--p);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}
h1{font-size:clamp(28px,5vw,46px);line-height:1.25;margin:14px 0}.muted{color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;font-weight:700;white-space:nowrap}.tab.active{background:var(--p);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:inherit}.full{grid-column:1/-1}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700}.primary{background:var(--p);color:#fff}.primary:active{background:var(--p2)}.ghost{background:var(--card);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:16px}.card{border:1px solid var(--line);border-radius:16px;padding:15px}.row{display:flex;justify-content:space-between;gap:10px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;color:var(--muted);font-size:12px;margin:10px 0}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.hidden{display:none!important}.status{background:var(--soft);padding:4px 8px;border-radius:999px;font-size:11px;height:max-content}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:700px){.form{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">P</div><div><b>Procura</b><small>Smart procurement. Trusted supply.</small></div></div>
  <button class="btn ghost" id="reset">مسح البيانات</button>
</header>

<main>
<section class="hero">
  <span class="pill">نسخة نهائية تجريبية</span>
  <h1>إدارة طلبات الشراء وعروض الموردين بسهولة</h1>
  <p class="muted">ملف واحد فقط، بدون مكتبات خارجية، ومناسب للموبايل وSafari.</p>
</section>

<nav class="tabs">
  <button class="tab active" data-target="buyer">العميل</button>
  <button class="tab" data-target="supplier">المورد</button>
  <button class="tab" data-target="admin">الإدارة</button>
</nav>

<section id="buyer" class="panel">
  <h2>إنشاء طلب شراء</h2>
  <form id="rfqForm" class="form">
    <label>اسم الشركة<input id="company" required></label>
    <label>اسم المشروع<input id="project" required></label>
    <label>الفئة<select id="category"><option>سباكة ومواسير PPR</option><option>دهانات</option><option>أدوات صحية</option><option>كهرباء وإضاءة</option></select></label>
    <label>آخر موعد للعروض<input id="deadline" type="date" required></label>
    <label class="full">تفاصيل الطلب<textarea id="items" rows="4" required></textarea></label>
    <label>مكان التوريد<input id="location" required></label>
    <label>صلاحية السعر بالأيام<input id="validity" type="number" value="7" min="1"></label>
    <button class="btn primary full" type="submit">نشر الطلب</button>
  </form>
  <div id="buyerList" class="cards"></div>
</section>

<section id="supplier" class="panel hidden">
  <h2>الطلبات المتاحة</h2>
  <div id="supplierList" class="cards"></div>
</section>

<section id="admin" class="panel hidden">
  <h2>لوحة الإدارة</h2>
  <div id="adminList" class="cards"></div>
</section>
</main>

<footer>Procura — نسخة تشغيل تجريبية</footer>

<script>
(function(){
  var KEY="procura_final_data";
  var db;
  try{db=JSON.parse(localStorage.getItem(KEY))||{rfqs:[],quotes:[]};}catch(e){db={rfqs:[],quotes:[]};}
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
  function save(){localStorage.setItem(KEY,JSON.stringify(db));render();}
  function uid(){return "RFQ-"+Date.now()+"-"+Math.floor(Math.random()*1000);}
  function render(){
    var buyer="",supplier="",admin="";
    if(!db.rfqs.length){
      buyer=supplier=admin='<div class="empty">لا توجد طلبات حاليًا.</div>';
    }else{
      for(var i=0;i<db.rfqs.length;i++){
        var r=db.rfqs[i];
        var card='<article class="card"><div class="row"><div><b>'+esc(r.project)+'</b><div class="muted">'+esc(r.company)+'</div></div><span class="status">مفتوح</span></div><div class="meta"><span>'+esc(r.category)+'</span><span>'+esc(r.location)+'</span><span>آخر موعد: '+esc(r.deadline)+'</span><span>صلاحية: '+esc(r.validity)+' أيام</span></div><p>'+esc(r.items)+'</p></article>';
        buyer+=card;
        supplier+=card;
        admin+=card;
      }
    }
    $("buyerList").innerHTML=buyer;
    $("supplierList").innerHTML=supplier;
    $("adminList").innerHTML=admin;
  }
  $("rfqForm").addEventListener("submit",function(e){
    e.preventDefault();
    db.rfqs.unshift({
      id:uid(),
      company:$("company").value.trim(),
      project:$("project").value.trim(),
      category:$("category").value,
      deadline:$("deadline").value,
      items:$("items").value.trim(),
      location:$("location").value.trim(),
      validity:$("validity").value
    });
    e.target.reset();
    $("validity").value="7";
    save();
    alert("تم نشر الطلب بنجاح");
  });
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener("click",function(){
      for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("active");
      this.classList.add("active");
      $("buyer").classList.add("hidden");$("supplier").classList.add("hidden");$("admin").classList.add("hidden");
      $(this.getAttribute("data-target")).classList.remove("hidden");
    });
  }
  $("reset").addEventListener("click",function(){
    if(confirm("مسح جميع البيانات؟")){db={rfqs:[],quotes:[]};save();}
  });
  render();
})();
</script>
</body>
</html>
